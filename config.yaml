# 抓取最近多少天内 PubMed 收录的新文章（首次测试设为 30，跑通后改为 7）
days_back: 30

# 每次最多处理多少篇新文献（防止单次文章过多消耗额度）
max_articles: 10

# 飞书每条消息合并几篇文献（控制在 2 篇以内，彻底避免超字数限制）
feishu_batch_size: 2

# 锁定的生物力学/运动医学顶刊（PubMed 标准简称）
journals:
  - "Br J Sports Med"
  - "Am J Sports Med"
  - "J Biomech"
  - "Gait Posture"
  - "Med Sci Sports Exerc"
  - "J Orthop Sports Phys Ther"
  - "Sports Med"
  - "Clin Biomech (Bristol, Avon)"

# 你的研究方向关键词（命中任意一个即抓取）
keywords:
  - "anterior cruciate ligament"
  - "ACL"
  - "limb symmetry"
  - "prehabilitation"
  - "running biomechanics"
  - "markerless"
  - "pose estimation"
  - "deep learning"
  - "ground reaction force"
