# 并发总结线程数（建议 3~4，既能提速 3 倍以上又不容易触发 API 限流）
max_workers: 3

# Unpaywall 免费 PDF 接口要求提供一个邮箱标识（可改成你自己的邮箱）
unpaywall_email: "biomech.radar@example.com"

# 锁定的生物力学 / 运动医学核心期刊（PubMed 标准简称）
journals:
  - "Br J Sports Med"
  - "Am J Sports Med"
  - "J Biomech"
  - "Gait Posture"
  - "Med Sci Sports Exerc"
  - "J Orthop Sports Phys Ther"
  - "Sports Med"
  - "Clin Biomech (Bristol, Avon)"
  - "J Sport Health Sci"
  - "Sports Biomech"
  - "Knee Surg Sports Traumatol Arthrosc"
  - "J Appl Biomech"

# 你的研究方向关键词（命中任意一个即抓取）
keywords:
  - "anterior cruciate ligament"
  - "ACL"
  - "limb symmetry"
  - "prehabilitation"
  - "running biomechanics"
  - "markerless"
  - "pose estimation"
  - "deep learning"
  - "machine learning"
  - "ground reaction force"
  - "joint moment"
  - "single-leg"
  - "landing biomechanics"
